name: Keep-Alive Ping

# Pings the deployed backend's health endpoint on a schedule.
#
# WHY THIS EXISTS — two free-tier hosting quirks:
#   1. Render's free web service spins down after 15 minutes with no inbound
#      HTTP traffic, and takes ~50 seconds to wake back up on the next request.
#      This app runs its nightly order-generation/freeze/delivery-sheet jobs as
#      in-process @Scheduled cron (BR-CUT-01 requires an exact 22:00 IST wall-
#      clock cutoff) — if the instance is asleep at that moment, the job simply
#      doesn't fire until the next request wakes it up, which could be hours
#      late or not at all that night.
#   2. Supabase's free Postgres project pauses after 7 days with no database
#      activity. /api/v1/health runs a real (trivial) DB query specifically so
#      this ping also counts as activity there.
#
# WARNING — GITHUB ACTIONS SCHEDULER IS UNRELIABLE:
#   GitHub Actions scheduled workflows are "best-effort" — they are NOT
#   guaranteed to fire at the exact cron time. Under high platform load,
#   schedules can be delayed by minutes or even HOURS (confirmed gap of 4h44m
#   observed in production run history on 2026-09-17). This means this workflow
#   ALONE is not a reliable keep-alive.
#
# RECOMMENDED: Use UptimeRobot (free) as the PRIMARY pinger:
#   1. Go to https://uptimerobot.com and create a free account.
#   2. Add a new monitor: HTTP(s) type.
#   3. URL: https://juice-platform-backend.onrender.com/api/v1/health
#   4. Monitoring interval: 5 minutes (well under Render's 15-min window).
#   UptimeRobot also sends email alerts if the backend goes down.
#   This workflow is a BACKUP to UptimeRobot, not the primary mechanism.
#
# IMPORTANT: set the BACKEND_HEALTH_URL repository variable:
#   Settings → Secrets and variables → Actions → Variables
#   BACKEND_HEALTH_URL = https://juice-platform-backend.onrender.com/api/v1/health
#
# If nightly jobs are ever found to have not run, check:
#   GET /admin/scheduler/history in the admin dashboard.

on:
  schedule:
    # Run at multiple offsets within the hour to reduce the chance that all
    # scheduled slots are missed by GitHub's jitter. Having 4 triggers per
    # hour (at :05, :20, :35, :50) means even if GitHub delays a slot by
    # 10-15 min, another slot fires before the 15-min Render spin-down window.
    # NOTE: avoid :00 (peak contention on GitHub's scheduler).
    - cron: '5 * * * *'
    - cron: '20 * * * *'
    - cron: '35 * * * *'
    - cron: '50 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          if [ -z "${{ vars.BACKEND_HEALTH_URL }}" ]; then
            echo "BACKEND_HEALTH_URL repository variable is not set — skipping ping."
            echo "Set it under Settings > Secrets and variables > Actions > Variables."
            echo "Value should be: https://juice-platform-backend.onrender.com/api/v1/health"
            exit 0
          fi
          echo "Pinging: ${{ vars.BACKEND_HEALTH_URL }}"
          # --max-time 60: allow up to 60s for a cold-start response.
          # -sf: silent + fail on HTTP errors (4xx/5xx).
          # The || true at the end prevents the step from failing on ping error
          # (a failed ping is expected during a cold start, not a workflow error).
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${{ vars.BACKEND_HEALTH_URL }}" || echo "000")
          echo "Response code: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Backend is up and healthy."
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "⚠️  Ping timed out or connection refused — backend may be cold-starting."
          else
            echo "⚠️  Unexpected HTTP $HTTP_CODE — backend may be restarting or degraded."
          fi
