<style>
        body {
            background-color: #f8faf8;
            font-family: 'Hanken Grotesk', sans-serif;
            color: #191c1b;
        }

        .login-card {
            box-shadow: 0px 4px 20px rgba(0, 40, 0, 0.05);
            transition: transform 0.2s ease-out;
        }

        .input-focus-line {
            transition: width 0.3s ease;
            width: 0;
        }

        input:focus + .input-focus-line {
            width: 100%;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden bg-surface">
<!-- Background Decorative Element (Subtle Gradient) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute -bottom-[10%] -right-[5%] w-[40%] h-[40%] bg-secondary/5 rounded-full blur-3xl"></div>
</div>
<!-- Main Content Container -->
<main class="w-full max-w-[440px] px-container-padding-mobile z-10">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-section-gap">
<div class="w-16 h-16 bg-primary flex items-center justify-center rounded-xl mb-4 shadow-sm">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="energy_savings_leaf" style="font-variation-settings: 'FILL' 1;">energy_savings_leaf</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">FreshFlow</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Admin Dashboard Access</p>
</div>
<!-- Login Form Card -->
<div class="login-card bg-surface-container-lowest rounded-xl p-card-inner-padding border border-outline-variant/30">
<form action="#" class="space-y-6" onsubmit="event.preventDefault();">
<!-- Phone Number Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase flex items-center gap-2" for="phone">
<span class="material-symbols-outlined text-[16px]" data-icon="phone_iphone">phone_iphone</span>
                        Phone Number
                    </label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant px-4 py-3 font-body-md text-body-md focus:ring-0 focus:outline-none transition-all placeholder:text-outline" id="phone" name="phone" placeholder="+91 98765 43210" required="" type="tel"/>
<div class="input-focus-line absolute bottom-0 left-0 h-0.5 bg-primary"></div>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[16px]" data-icon="lock">lock</span>
                            Password
                        </label>
</div>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant px-4 py-3 font-body-md text-body-md focus:ring-0 focus:outline-none transition-all placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="input-focus-line absolute bottom-0 left-0 h-0.5 bg-primary"></div>
<button class="absolute right-3 top-3 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-4 rounded-lg shadow-sm hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-3" type="submit">
<span class="material-symbols-outlined" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
                    Login to FreshFlow
                </button>
<!-- Security Trust Note -->
<div class="flex items-center justify-center gap-2 pt-2">
<span class="material-symbols-outlined text-wallet-credit text-[16px]" data-icon="security">security</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Secure AES-256 Encrypted Session</span>
</div>
</form>
</div>
<!-- Support Footer -->
<footer class="mt-8 text-center space-y-4">
<p class="font-body-md text-body-md text-on-surface-variant">
                Forgot password? 
                <a class="text-primary font-bold hover:underline" href="#">Contact support</a>
</p>
<div class="flex justify-center gap-4 text-outline font-label-caps text-label-caps uppercase tracking-widest">
<a class="hover:text-on-surface-variant transition-colors" href="#">System Status</a>
<span class="text-outline-variant">•</span>
<a class="hover:text-on-surface-variant transition-colors" href="#">Privacy Policy</a>
<span class="text-outline-variant">•</span>
<a class="hover:text-on-surface-variant transition-colors" href="#">Help Center</a>
</div>
</footer>
</main>
<!-- Side Image Ornament (Visible on Desktop) -->
<aside class="hidden lg:block absolute right-0 top-0 h-full w-1/3 overflow-hidden">
<div class="h-full w-full relative">
<div class="absolute inset-0 bg-cover bg-center" data-alt="High-fidelity macro photography of organic morning dew on fresh vibrant green spinach leaves. The lighting is crisp, high-key morning sun, creating a transparent and vital atmosphere. The color palette is dominated by deep forest greens and bright lime highlights, perfectly matching the professional and healthy aesthetic of the FreshFlow brand." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCFj1YFYB5NfhMUjMtvsSBVYdPt-oR_nI9OpHtxEGoYM65F6hD-XWgSSvJqzJqFjfZ5-zlEWEEJcw0CZchCUJnIIYWED2TZlI7McW_NxZDSJrPQiC0cuO2MActk5cz7VBJjUPrP208nwxFoWElenRIc3kpzeR04AslwDSklEo8JVeDXEoAYq1WukyKwCYd6fqsBrUwcxAv7DJ4Aitk33oUkMsQX_lhO17CiqiiQEQE3sB055G3WzIpmZ-I3OZaSE1mRUy7Khfeb4F0')"></div>
<div class="absolute inset-0 bg-gradient-to-l from-transparent via-transparent to-surface"></div>
<!-- Floating Data Point Card -->
<div class="absolute top-1/4 left-10 bg-surface-container-lowest/90 backdrop-blur-md p-6 rounded-xl shadow-lg border border-outline-variant/30 max-w-xs animate-bounce" style="animation-duration: 4s;">
<div class="flex items-center gap-3 mb-2">
<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-fixed text-[18px]" data-icon="trending_up">trending_up</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Real-time Pulse</span>
</div>
<div class="font-headline-sm text-headline-sm text-primary">1,240 deliveries</div>
<div class="font-body-sm text-body-sm text-on-surface-variant">scheduled for tomorrow</div>
</div>
</div>
</aside>
<script>
        // Subtle micro-interaction for password visibility
        const visibilityBtn = document.querySelector('button[type="button"]');
        const passwordInput = document.getElementById('password');
        let isVisible = false;

        visibilityBtn.addEventListener('click', () => {
            isVisible = !isVisible;
            passwordInput.type = isVisible ? 'text' : 'password';
            visibilityBtn.querySelector('span').textContent = isVisible ? 'visibility_off' : 'visibility';
        });

        // Add focus effects to inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });
    </script>
</body></html>
