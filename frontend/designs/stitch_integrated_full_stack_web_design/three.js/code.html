<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_29 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_29" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_29');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x1b5e20, 1, 10);
pointLight.position.set(2, 2, 2);
scene.add(pointLight);

// Create a stylized "Juice Drop" or "Bottle" silhouette
// We'll use a rounded cylinder as a proxy for a juice bottle
const geometry = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 32);
const material = new THREE.MeshPhongMaterial({ 
    color: 0x1b5e20, 
    shininess: 100,
    transparent: true,
    opacity: 0.9
});
const bottle = new THREE.Mesh(geometry, material);
scene.add(bottle);

camera.position.z = 3;

// Animation
function animate() {
    requestAnimationFrame(animate);
    
    bottle.rotation.y += 0.01;
    bottle.position.y = Math.sin(Date.now() * 0.002) * 0.1;
    
    renderer.render(scene, camera);
}

// Resize handling
window.addEventListener('resize', () => {
    const newWidth = container.clientWidth || window.innerWidth;
    const newHeight = container.clientHeight || window.innerHeight;
    
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(newWidth, newHeight);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_29 -->
</body>
</html>
