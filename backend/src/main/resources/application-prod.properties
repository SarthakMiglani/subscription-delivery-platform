# Production profile overrides.
#
# Activate with: SPRING_PROFILES_ACTIVE=prod
#
# This profile does NOT enable the "dev" profile's DevAuthController — the two are
# independent Spring profiles. Never combine "prod" with "dev" in the same run.
#
# Every value below is sourced from an environment variable with no baked-in secret
# default. Required variables are documented in backend/.env.example. The app will
# fail fast at startup if JWT_SECRET or GOOGLE_CLIENT_ID are missing/too short
# (enforced in JwtServiceImpl / GoogleTokenVerifier), and Spring will fail to start
# if the datasource variables are missing since there is no fallback here.

# ── Datasource ────────────────────────────────────────────────────────────────
# No hardcoded fallback — must be supplied via environment in production.
#
# Supabase note: use the Session Pooler connection string (port 5432 on
# aws-*.pooler.supabase.com), not the Direct Connection string. Render's network
# is IPv4-only and Supabase's direct connection is IPv6-only unless you pay for
# the IPv4 add-on — the session pooler is Supabase's IPv4-reachable path and
# still supports prepared statements/DDL the way Hibernate and Flyway expect
# (unlike the transaction-mode pooler on port 6543, which does not).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Small pool bounds — Supabase's free-tier Postgres and session pooler both
# have low connection ceilings; a small Java app on Render's free 512MB
# instance has no need for a large pool anyway at this traffic scale.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# ── CORS ──────────────────────────────────────────────────────────────────────
# Must be overridden with the real frontend origin(s), e.g.:
# https://app.juiceplatform.com,https://admin.juiceplatform.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# ── API docs ──────────────────────────────────────────────────────────────────
# Swagger UI / OpenAPI JSON are disabled by default in production. They document
# every request/response shape and are unauthenticated by design (SecurityConfig
# permits /swagger-ui/** and /v3/api-docs/**) — safe for internal use, but there is
# no reason to expose them publicly. Set ENABLE_SWAGGER=true to turn them back on
# temporarily (e.g. for API debugging against the prod backend).
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:false}
springdoc.api-docs.enabled=${ENABLE_SWAGGER:false}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.juiceplatform=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ── Server ────────────────────────────────────────────────────────────────────
# Render assigns its own PORT env var and expects the app to bind to it
# (defaults to 10000 if unset). On a VPS-style deployment behind your own nginx,
# PORT is simply left unset and this falls back to 8080 as before.
server.port=${PORT:8080}
server.forward-headers-strategy=native
